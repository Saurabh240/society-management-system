spring.datasource.username=societydb
spring.datasource.password=Societydb@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway Configuration (Docker)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

# Frontend URL
app.frontend.base-url=http://localhost

# Multipart config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# Storage provider
app.storage.provider=local
app.storage.upload-dir=/app/uploads

# Bill attachment limits
bill.attachment.max-files=5
bill.attachment.max-size-mb=10

