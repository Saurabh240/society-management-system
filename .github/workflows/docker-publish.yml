name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/society-backend:dev \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/society-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/society-backend:${IMAGE_TAG} \
            --push -f backend/Dockerfile backend

      - name: Build and push frontend image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/society-frontend:dev \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/society-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/society-frontend:${IMAGE_TAG} \
            --push -f frontend/Dockerfile frontend